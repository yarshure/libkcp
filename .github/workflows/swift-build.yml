name: Swift Package Build

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  swift-build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift
        uses: fwal/setup-swift@v3
        with:
          swift-version: '5.9'

      - name: Swift package resolve
        run: swift package resolve

      - name: Swift build
        run: swift build --disable-sandbox

      - name: Swift test
        run: swift test --disable-sandbox
